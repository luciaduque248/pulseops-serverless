AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PulseOps serverless incident operations platform

Parameters:
  AppName:
    Type: String
    Default: pulseops

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 12
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PulseOpsTable
        ATTACHMENTS_BUCKET: !Ref AttachmentsBucket

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: Full operational access
      UserPoolId: !Ref UserPool
      Precedence: 1

  AgentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Agents
      Description: Incident operations agents
      UserPoolId: !Ref UserPool
      Precedence: 2

  PulseOpsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        MaxAge: 86400
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  PulseOpsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-attachments-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: expire-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: WebBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: WebBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies: { Forward: none }
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: src/handlers/health.handler
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref PulseOpsApi
            Path: /health
            Method: GET
            Auth: { Authorizer: NONE }
    Metadata: &EsbuildHealth
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/health.ts]

  IncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: src/handlers/incidents.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PulseOpsTable }
      Events:
        List: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: /incidents, Method: GET } }
        Create: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: /incidents, Method: POST } }
        Get: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}', Method: GET } }
        Update: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}', Method: PATCH } }
        Delete: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}', Method: DELETE } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: true, Target: es2022, Sourcemap: true, EntryPoints: [src/handlers/incidents.ts] }

  CommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: src/handlers/comments.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PulseOpsTable }
      Events:
        ListComments: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}/comments', Method: GET } }
        AddComment: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}/comments', Method: POST } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: true, Target: es2022, Sourcemap: true, EntryPoints: [src/handlers/comments.ts] }

  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: src/handlers/dashboard.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PulseOpsTable }
      Events:
        Dashboard: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: /dashboard, Method: GET } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: true, Target: es2022, Sourcemap: true, EntryPoints: [src/handlers/dashboard.ts] }

  UploadsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/api
      Handler: src/handlers/uploads.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref PulseOpsTable }
        - S3WritePolicy: { BucketName: !Ref AttachmentsBucket }
      Events:
        Presign: { Type: HttpApi, Properties: { ApiId: !Ref PulseOpsApi, Path: '/incidents/{id}/attachments/presign', Method: POST } }
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: true, Target: es2022, Sourcemap: true, EntryPoints: [src/handlers/uploads.ts] }

Outputs:
  ApiUrl:
    Value: !Sub 'https://${PulseOpsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AttachmentsBucketName:
    Value: !Ref AttachmentsBucket
  FrontendBucketName:
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
  WebUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
